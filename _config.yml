# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Nicolás Garavito Camargo
email: garavito@umd.edu
description: >
  NASA Einstein Fellow at the University of Maryland studying
  Milky Way dynamics and dark matter.
baseurl: "/Garavito-Camargo" # the subpath of your site, e.g. /blog
url: "https://jngaravitoc.github.io" # the base hostname & protocol for your site
