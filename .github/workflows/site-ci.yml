name: Site CI

on:
  push:
    branches:
      - gh-pages
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          bundler-cache: true

      - name: Build Jekyll site
        run: |
          set -euo pipefail
          bundle exec jekyll build

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies for ADS updater
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ADS updater unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py"

      - name: Validate ADS updater (dry-run)
        if: ${{ secrets.ADS_TOKEN != '' }}
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/update_recent_pubs.py --months 12 --dry-run > /dev/null

      - name: Skip ADS updater validation when token is unavailable
        if: ${{ secrets.ADS_TOKEN == '' }}
        run: |
          echo "ADS_TOKEN is not available in this context; skipping ADS dry-run validation."
