name: Update Recent Publications

on:
  schedule:
    # Runs at 09:00 UTC on the 1st of every other month (Jan, Mar, May, Jul, Sep, Nov)
    - cron: "0 9 1 */2 *"
  workflow_dispatch: # Allow manual trigger from the Actions tab

jobs:
  update-pubs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch recent papers from ADS
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python scripts/update_recent_pubs.py --months 12

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet _pages/cv_pub.md && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _pages/cv_pub.md
          git commit -m "Update recent publications from ADS [automated]"
          git push
