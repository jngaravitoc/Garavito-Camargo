name: Update Recent Publications

on:
  schedule:
    # Runs at 09:00 UTC on the 1st of every other month (Jan, Mar, May, Jul, Sep, Nov)
    - cron: "0 9 1 */2 *"
  workflow_dispatch: # Allow manual trigger from the Actions tab

concurrency:
  group: update-recent-pubs
  cancel-in-progress: true

jobs:
  update-pubs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch recent papers from ADS
        if: ${{ secrets.ADS_TOKEN != '' }}
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/update_recent_pubs.py --months 12

      - name: Fail if ADS token is missing
        if: ${{ secrets.ADS_TOKEN == '' }}
        run: |
          echo "ADS_TOKEN is not configured for this repository."
          echo "Add ADS_TOKEN in repository secrets to enable scheduled publication updates."
          exit 1

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          git diff --quiet _pages/cv_pub.md && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _pages/cv_pub.md
          git commit -m "Update recent publications from ADS [automated]"
          git push
